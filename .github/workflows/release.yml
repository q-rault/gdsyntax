# Keep the file name release.yml: crates.io trusted publishing is set up for it.
name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*'
  # Cut release (cut-release.yml) starts it this way, on the tag it pushed: a
  # tag pushed with the default token does not trigger `push`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    # Run by hand, it must be on a release tag, not a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "gdsyntax") | .version')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gdsyntax version ${VERSION} in Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Get a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are prereleases: never marked "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
