[package]
name = "gdsyntax"
version = "0.1.5"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdsyntax"
homepage = "https://github.com/q-rault/gdsyntax"
authors = ["Quentin Rault"]
description = "GDScript syntax trees and syntax errors, shared by the gdsuite tools"
readme = "README.md"
keywords = ["godot", "gdscript", "parser", "syntax-tree", "lossless"]
categories = ["parser-implementations", "development-tools"]
# Godot's test scripts are only needed to run the tests from the repository.
exclude = ["tests/godot", "rfcs", "scripts", ".github", "Justfile"]

[dependencies]
rowan = "0.16"

[dev-dependencies]
rowan = "0.16"
