# Keep the file name release.yml: crates.io trusted publishing is set up for it.
name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*'
  # Cut release (cut-release.yml) starts it this way, on the tag it pushed: a
  # tag pushed with the default token does not trigger `push`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    # Run by hand, it must be on a release tag, not a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "gdsyntax") | .version')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gdsyntax version ${VERSION} in Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Get a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are prereleases: never marked "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

  notify-dependents:
    name: Ask the tools to update gdsyntax
    needs: release
    # The tools follow stable releases only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      # Starts Update gdsyntax (update-gdsyntax.yml) in each tool that uses
      # gdsyntax, which opens or updates its PR. DEPENDENTS_TRIGGER_TOKEN can
      # only start workflows in those repositories (see PUBLISHING.md).
      - name: Start Update gdsyntax in each tool
        env:
          GH_TOKEN: ${{ secrets.DEPENDENTS_TRIGGER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DEPENDENTS_TRIGGER_TOKEN is not set: run Update gdsyntax in gdhealth, gdtest and gdtidy by hand"
            exit 0
          fi
          failed=0
          for repo in gdhealth gdtest gdtidy; do
            if gh workflow run update-gdsyntax.yml -R "q-rault/${repo}" -f release="gdsyntax ${GITHUB_REF_NAME}"; then
              echo "Started Update gdsyntax in ${repo}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not start Update gdsyntax in ${repo}"
              failed=1
            fi
          done
          exit "$failed"
